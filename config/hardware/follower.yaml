# 300 mmフォロワーの共通設定。接続先と校正確認は起動側で指定する。
hardware_verified: false
connection:
  port: /dev/topoarm-unconfigured
  baud_rate: 2000000
  latency_timer: 2
model: 300mm
modules: []  # パンチルト付きは [pan_tilt]
options:
  startup_configuration: apply
  clip_to_limits: true
  floor_config: ../floor.yaml
  neck_envelope: true
  neck_limits:
    outward_margin: 0.008726646259971648
    pan_abs_at_outer: 0.7853981633974483
    tilt_min_at_outer: -0.8726646259971648
  return_delay_time: 10
  torque_retention: true
  write_pid_on_connect: true
actuator_profiles:
  follower_xm430:
    position_kp: 400
    position_ki: 0
    position_kd: 4000
    profile_velocity: 0
    profile_acceleration: 0
    profile_duration_ms: 120
    profile_acceleration_ms: 60
  follower_xm540:
    position_kp: 1000
    position_ki: 0
    position_kd: 8000
    profile_velocity: 0
    profile_acceleration: 0
    profile_duration_ms: 60
    profile_acceleration_ms: 20
